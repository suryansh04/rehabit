<!doctype html><html lang='en'><head><meta charset='utf-8'><title>2 Game</title><style>
@font-face{font-family:'Jakarta';font-weight:500;src:url(fonts/plus-jakarta-sans-500.woff2) format('woff2')}
@font-face{font-family:'Jakarta';font-weight:700;src:url(fonts/plus-jakarta-sans-700.woff2) format('woff2')}
:root{--bg:#F3F0FA;--sf:#FFFFFF;--tx:#1B1530;--mu:#5F5979;--ac:#6B4EF6;--ln:#E4DEF5;--mint:#DDF5E8;--peach:#FFE7D9;--lilac:#E9E3FF;
--sh:0 1px 2px rgba(27,21,48,.04),0 18px 40px rgba(27,21,48,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.5 'Jakarta',sans-serif;width:1280px;height:900px;padding:32px 40px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px}
.logo{font:700 24px/1 'Jakarta';letter-spacing:-.02em} .logo i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ac);margin-left:3px}
.pill{font-size:14px;padding:8px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--ln)}
.tile{background:var(--sf);border-radius:28px;box-shadow:var(--sh);padding:24px}
.flat{box-shadow:none}
.k{color:var(--mu);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.big{font:700 40px/1 'Jakarta';letter-spacing:-.03em;display:block;margin:8px 0 4px} .big small{font-size:18px;font-weight:500;color:var(--mu);margin-left:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 19px/1 'Jakarta';padding:20px 30px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
.btn.primary{background:var(--ac);color:#fff;border-color:var(--ac)} .btn.dark{background:var(--tx);color:#fff;border-color:var(--tx)}
.bubble{background:var(--sf);border-radius:22px 22px 22px 6px;padding:14px 18px;box-shadow:var(--sh);font-weight:700}
.bubble span{display:block;font-weight:500;font-size:13px;color:var(--mu)}
h1{font:700 34px/1.15 'Jakarta';letter-spacing:-.02em} h2{font:700 20px/1.2 'Jakarta'}

.ring{position:relative} .ring>svg{position:absolute;inset:0} .ring .inner{position:absolute;inset:0;display:grid;place-items:center}
.stat{border-radius:24px;padding:18px 20px} .stat .big{font-size:36px}
.count{font:700 88px/1 'Jakarta';letter-spacing:-.04em} .count small{font-size:28px;color:var(--mu);font-weight:500}
.hint{font-size:15px;color:var(--mu)}

main{flex:1;display:grid;grid-template-columns:1fr 600px 1fr;align-items:center;gap:24px}
.left,.right{display:flex;flex-direction:column;gap:14px}
</style></head><body><div class='top'><span class='logo'>rehabit<i></i></span><span class='pill'><b>Classic</b> · Right hand</span><span style='margin-left:auto;display:flex;gap:10px'><span class='btn' style='padding:12px 22px;font-size:15px'>Pause</span></span></div>
